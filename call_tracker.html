<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="発言記録">
<title>発言記録</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f5f5f3;--bg3:#eeede9;
  --text:#1a1a18;--text2:#666660;--text3:#999993;
  --border:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.22);
  --radius:8px;--radius-lg:12px;
  --font:-apple-system,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1c1c1a;--bg2:#252523;--bg3:#2e2e2b;
    --text:#f0efe9;--text2:#aaa89e;--text3:#6b6a63;
    --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.2);
  }
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
.app{max-width:900px;margin:0 auto;padding:1rem}
.screen{display:none}.screen.active{display:block}

.top-bar{display:flex;align-items:center;gap:10px;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:0.5px solid var(--border)}
.top-bar h2{font-size:16px;font-weight:500;flex:1}
.btn{font-size:13px;padding:6px 14px;border-radius:var(--radius);border:0.5px solid var(--border2);background:transparent;color:var(--text);cursor:pointer;white-space:nowrap;font-family:var(--font)}
.btn:hover{background:var(--bg2)}
.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.primary:hover{opacity:0.85}
.btn.danger{color:#A32D2D;border-color:#F7C1C1}
.btn.small{font-size:12px;padding:4px 10px}

.course-list{display:flex;flex-direction:column;gap:8px;margin-bottom:1.5rem}
.course-card{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);cursor:pointer}
.course-card:hover{border-color:var(--border2);background:var(--bg2)}
.course-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.course-info{flex:1}
.course-name{font-size:14px;font-weight:500}
.course-meta{font-size:12px;color:var(--text2);margin-top:2px}

.add-form{background:var(--bg2);border-radius:var(--radius-lg);padding:1rem;margin-bottom:1rem}
.add-form h3{font-size:14px;font-weight:500;margin-bottom:12px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.form-row.full{grid-template-columns:1fr}
.form-row.three{grid-template-columns:1fr 1fr 1fr}
.form-row label{font-size:12px;color:var(--text2);display:block;margin-bottom:3px}
.form-row input,.form-row select,.form-row textarea{width:100%;font-size:13px;padding:7px 10px;border-radius:var(--radius);border:0.5px solid var(--border2);background:var(--bg);color:var(--text);font-family:var(--font)}
.form-row textarea{resize:vertical;min-height:100px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}

.tracker-sub{font-size:13px;color:var(--text2);margin-bottom:1.25rem}
.session-bar{display:flex;align-items:center;gap:10px;margin-bottom:1.5rem;padding:10px 14px;background:var(--bg2);border-radius:var(--radius)}
.session-label{font-size:13px;color:var(--text2);flex:1}
.session-select{font-size:13px;padding:5px 8px;border-radius:var(--radius);border:0.5px solid var(--border2);background:var(--bg);color:var(--text);font-family:var(--font)}

.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1.5rem}
.stat-card{background:var(--bg2);border-radius:var(--radius);padding:10px 12px;text-align:center}
.stat-card .val{font-size:22px;font-weight:500}
.stat-card .lbl{font-size:11px;color:var(--text2);margin-top:2px}

.grid-wrap{overflow-x:auto;margin-bottom:1.5rem;-webkit-overflow-scrolling:touch}
.roster-grid{border-collapse:collapse;width:100%;min-width:420px}
.roster-grid th{font-size:11px;font-weight:500;color:var(--text2);padding:4px 3px;text-align:center;white-space:nowrap;border-bottom:0.5px solid var(--border)}
.roster-grid th.name-col{text-align:left;padding-left:8px;min-width:100px}
.roster-grid td{padding:3px;text-align:center;vertical-align:middle}
.roster-grid td.name-col{text-align:left;padding-left:8px;font-size:13px;padding-top:5px;padding-bottom:5px}
.roster-grid tr:nth-child(even) td{background:rgba(0,0,0,0.025)}
.roster-grid tr:hover td{background:var(--bg2)}

.cell-btn{width:22px;height:22px;border-radius:4px;border:0.5px solid var(--border);background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.cell-btn.called{background:#1D9E75;border-color:#1D9E75}
.cell-btn.called::after{content:'';display:block;width:10px;height:10px;background:white;border-radius:1px}
.cell-btn.cur-session{border-color:#185FA5;border-width:1.5px}

.total-badge{display:inline-block;font-size:11px;font-weight:500;padding:2px 7px;border-radius:10px;background:var(--bg2);color:var(--text3);min-width:26px;text-align:center}
.total-badge.some{background:#E1F5EE;color:#0F6E56}
.total-badge.high{background:#E6F1FB;color:#185FA5}

.export-row{display:flex;gap:8px;justify-content:flex-end;padding-top:1rem;border-top:0.5px solid var(--border)}
.empty-msg{font-size:13px;color:var(--text2);padding:3rem 0;text-align:center}
</style>
</head>
<body>
<div class="app">
  <div id="home" class="screen active">
    <div class="top-bar">
      <h2>発言記録</h2>
      <button class="btn primary" onclick="showAddForm()">+ 講座を追加</button>
    </div>
    <div id="add-form-wrap" style="display:none">
      <div class="add-form">
        <h3>新しい講座</h3>
        <div class="form-row">
          <div><label>大学名</label><input id="f-univ" placeholder="例: 工学院大学"></div>
          <div><label>講座名</label><input id="f-course" placeholder="例: 英語コミュニケーションA"></div>
        </div>
        <div class="form-row three">
          <div><label>全回数</label><select id="f-sessions"><option value="14">14回</option><option value="15" selected>15回</option></select></div>
          <div><label>スクールカラー（任意）</label><input id="f-color" type="color" value="#3E49AB" style="height:35px;padding:2px;width:100%"></div>
          <div></div>
        </div>
        <div class="form-row full">
          <div>
            <label style="display:flex;align-items:center;justify-content:space-between">
              <span>名簿（1行に1名、番号付きでも可）</span>
              <label class="btn small" style="cursor:pointer;margin:0;font-size:11px;padding:3px 9px">
                📂 ファイルから読み込む
                <input type="file" id="f-roster-file" accept=".txt,.csv,.tsv" style="display:none" onchange="loadRosterFile(this)">
              </label>
            </label>
            <textarea id="f-roster" placeholder="【対応形式】タブ・カンマ区切りCSV、または1行1名のテキスト&#10;&#10;出席番号,学籍番号,氏名,読み仮名（CSV・ヘッダー行あり）&#10;出席番号,学籍番号,氏名,読み仮名&#10;1,2024001,山田花子,やまだはなこ&#10;&#10;学籍番号,氏名,読み仮名（CSV）&#10;2024001,山田花子,やまだはなこ&#10;2024002,鈴木一郎,すずきいちろう&#10;&#10;または スペース区切り&#10;2024001 山田花子 やまだはなこ&#10;&#10;または 氏名のみ&#10;山田花子&#10;鈴木一郎"></textarea>
            <div id="roster-parse-info" style="font-size:11px;color:var(--text2);margin-top:4px;display:none"></div>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn" onclick="hideAddForm()">キャンセル</button>
          <button class="btn primary" onclick="addCourse()">登録</button>
        </div>
      </div>
    </div>
    <div id="course-list" class="course-list"></div>
    <p id="empty-msg" class="empty-msg">講座を追加してください</p>
  </div>

  <div id="tracker" class="screen">
    <div class="top-bar">
      <button class="btn" onclick="goHome()">← 一覧へ</button>
      <h2 id="t-title"></h2>
      <button class="btn small danger" onclick="deleteCourse()">削除</button>
    </div>
    <p class="tracker-sub" id="t-sub"></p>
    <div class="session-bar">
      <span class="session-label">現在の授業回</span>
      <select class="session-select" id="session-select" onchange="changeSession()"></select>
      <button class="btn small" onclick="exportCSV()">CSV出力</button>
    </div>
    <div class="stats-row">
      <div class="stat-card"><div class="val" id="s-total">0</div><div class="lbl">累計フラグ数</div></div>
      <div class="stat-card"><div class="val" id="s-this">0</div><div class="lbl">今回当てた人数</div></div>
      <div class="stat-card"><div class="val" id="s-zero">0</div><div class="lbl">まだ0回の人</div></div>
    </div>
    <div class="grid-wrap">
      <table class="roster-grid" id="roster-table"></table>
    </div>
    <div class="export-row">
      <button class="btn" onclick="exportCSV()">CSV出力（全回分）</button>
    </div>
  </div>
</div>

<script>
const STORE_KEY='calltracker_v1';
let data={courses:[]};
let currentId=null,currentSession=1;

function load(){try{const s=localStorage.getItem(STORE_KEY);if(s)data=JSON.parse(s);}catch(e){}}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(data));}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function getCourse(id){return data.courses.find(c=>c.id===id)}

// 学籍番号らしい文字列かどうか判定（数字のみ、または英数字混在の短い文字列）
function looksLikeStudentId(s){
  return /^[A-Za-z０-９\d]{4,12}$/.test(s.replace(/\s/g,''));
}
// 読み仮名らしい文字列かどうか（ひらがな・カタカナ主体）
function looksLikeKana(s){
  return /^[\u3040-\u30FF\s・ ]+$/.test(s.trim())&&s.trim().length>0;
}

function parseRoster(text){
  const lines=text.trim().split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length)return[];

  // 区切り文字を検出（タブ優先、次にカンマ）
  const useTab=lines.some(l=>l.includes('\t'));
  const useCsv=!useTab&&lines.some(l=>l.split(',').length>=2);

  if(useTab||useCsv){
    const splitLine=l=>(useTab?l.split('\t'):l.split(',')).map(p=>p.trim());
    const allRows=lines.map(splitLine);

    // ヘッダー行の検出（出席番号・学籍番号・氏名などのキーワードを含む）
    const headerKeywords=['出席番号','学籍番号','学生番号','氏名','名前','読み仮名','ふりがな','フリガナ'];
    const isHeader=allRows[0].some(h=>headerKeywords.some(k=>h.includes(k)));

    let sidCol=-1,nameCol=-1,kanaCol=-1;
    let dataRows=allRows;

    if(isHeader){
      dataRows=allRows.slice(1); // ヘッダー行をスキップ
      allRows[0].forEach((h,i)=>{
        if(h.includes('学籍')||h.includes('学生番号')){sidCol=i;}
        else if(h.includes('氏名')||h.includes('名前')){nameCol=i;}
        else if(h.includes('読み仮名')||h.includes('ふりがな')||h.includes('フリガナ')){kanaCol=i;}
        // 出席番号は sidCol に割り当てない（スキップ）
      });
    }

    return dataRows.map(parts=>{
      let sid='',name='',kana='';
      if(isHeader){
        // ヘッダーで列を特定できた場合
        if(nameCol<0)return null;
        sid=sidCol>=0?(parts[sidCol]||''):'';
        name=parts[nameCol]||'';
        kana=kanaCol>=0?(parts[kanaCol]||''):'';
      }else if(parts.length>=3){
        // ヘッダーなし：先頭列が出席番号（連番）かどうか判定してスキップ
        let offset=0;
        const first=parts[0];
        if(/^\d{1,4}$/.test(first)){
          // 4列以上 → 先頭は出席番号とみなしてスキップ
          if(parts.length>=4)offset=1;
          // 3列でも 1〜3桁の連番（学籍番号らしくない）ならスキップ
          else if(!looksLikeStudentId(first))offset=1;
        }
        sid=parts[offset]||'';
        name=parts[offset+1]||'';
        kana=parts[offset+2]||'';
      }else if(parts.length===2){
        // 2列：学籍番号+氏名、または氏名+読み仮名
        if(looksLikeStudentId(parts[0])){
          sid=parts[0];name=parts[1];
        }else if(looksLikeKana(parts[1])){
          name=parts[0];kana=parts[1];
        }else{
          sid=parts[0];name=parts[1];
        }
      }else{
        name=parts[0];
      }
      if(!name)return null;
      return{sid,name,kana};
    }).filter(Boolean);
  }

  // 1行1名（スペース区切り）：「学籍番号 氏名 読み仮名」または「番号 氏名」または「氏名のみ」
  return lines.map(l=>{
    // 先頭の連番（1. 2. など）を除去
    l=l.replace(/^[\d０-９]+[\.\．。・、,，\)）]\s*/,'');
    const parts=l.split(/\s+/);
    let sid='',name='',kana='';
    if(parts.length>=3&&looksLikeStudentId(parts[0])){
      sid=parts[0];
      // 残りをname/kanaに分ける（読み仮名はひらがな・カタカナ主体）
      const rest=parts.slice(1);
      const kanaIdx=rest.findIndex(p=>looksLikeKana(p));
      if(kanaIdx>=0){name=rest.filter((_,i)=>i!==kanaIdx).join(' ');kana=rest[kanaIdx];}
      else{name=rest.join(' ');}
    }else if(parts.length===2&&looksLikeStudentId(parts[0])){
      sid=parts[0];name=parts[1];
    }else{
      // 氏名のみ（読み仮名部分があればスペースで分かれている場合も）
      const kanaIdx=parts.findIndex(p=>looksLikeKana(p));
      if(kanaIdx>=0){name=parts.filter((_,i)=>i!==kanaIdx).join('');kana=parts[kanaIdx];}
      else{name=parts.join(' ');}
    }
    if(!name)return null;
    return{sid,name,kana};
  }).filter(Boolean);
}

// 旧形式（文字列配列）との互換ヘルパー
function studentName(s){return typeof s==='string'?s:s.name;}
function studentSid(s){return typeof s==='string'?'':s.sid||'';}
function studentKana(s){return typeof s==='string'?'':s.kana||'';}

function loadRosterFile(input){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    let text=e.target.result;
    if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
    document.getElementById('f-roster').value=text;
    const students=parseRoster(text);
    const info=document.getElementById('roster-parse-info');
    if(students.length>0){
      const hasSid=students.some(s=>s.sid);
      const hasKana=students.some(s=>s.kana);
      const preview=students.slice(0,3).map(s=>[s.sid,s.name,s.kana].filter(Boolean).join(' ')).join('、');
      const fields=[`${students.length}名`,hasSid?'学籍番号✓':'',hasKana?'読み仮名✓':''].filter(Boolean).join(' / ');
      info.style.display='block';
      info.innerHTML=`✓ ${fields}を読み込みました：${preview}${students.length>3?' …など':''}`;
      info.style.color='#0F6E56';
    }else{
      info.style.display='block';
      info.textContent='名前を読み取れませんでした。テキストを直接確認してください。';
      info.style.color='#A32D2D';
    }
    input.value='';
  };
  reader.readAsText(file,'UTF-8');
}

function renderHome(){
  const list=document.getElementById('course-list');
  const empty=document.getElementById('empty-msg');
  list.innerHTML='';
  if(!data.courses.length){empty.style.display='block';return;}
  empty.style.display='none';
  data.courses.forEach(c=>{
    const total=c.flags?Object.values(c.flags).flat().reduce((a,b)=>a+b,0):0;
    const div=document.createElement('div');
    div.className='course-card';
    div.innerHTML=`
      <div class="course-dot" style="background:${c.color||'#888'}"></div>
      <div class="course-info">
        <div class="course-name">${esc(c.univ)} — ${esc(c.name)}</div>
        <div class="course-meta">${c.roster.length}名 / ${c.sessions}回 / 累計 ${total}フラグ</div>
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn small" onclick="openTracker('${c.id}');event.stopPropagation()">開く</button>
      </div>`;
    div.onclick=()=>openTracker(c.id);
    list.appendChild(div);
  });
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function showAddForm(){document.getElementById('add-form-wrap').style.display='block'}
function hideAddForm(){document.getElementById('add-form-wrap').style.display='none';clearForm()}
function clearForm(){['f-univ','f-course','f-roster'].forEach(id=>document.getElementById(id).value='');document.getElementById('f-sessions').value='15';document.getElementById('f-color').value='#3E49AB'}

function addCourse(){
  const univ=document.getElementById('f-univ').value.trim();
  const name=document.getElementById('f-course').value.trim();
  const sessions=parseInt(document.getElementById('f-sessions').value);
  const color=document.getElementById('f-color').value;
  const rosterText=document.getElementById('f-roster').value;
  if(!univ||!name||!rosterText){alert('大学名・講座名・名簿は必須です');return}
  const roster=parseRoster(rosterText);
  if(!roster.length){alert('名簿を正しく入力してください');return}
  data.courses.push({id:uid(),univ,name,sessions,color,roster,flags:{}});
  save();hideAddForm();renderHome();
}

function deleteCourse(){
  if(!currentId)return;
  const c=getCourse(currentId);
  if(!c||!confirm(`「${c.univ} — ${c.name}」を削除しますか？`))return;
  data.courses=data.courses.filter(x=>x.id!==currentId);
  save();goHome();
}

function openTracker(id){
  currentId=id;currentSession=1;
  const c=getCourse(id);if(!c)return;
  document.getElementById('t-title').textContent=c.name;
  document.getElementById('t-sub').textContent=c.univ+' / '+c.sessions+'回 / '+c.roster.length+'名';
  const sel=document.getElementById('session-select');
  sel.innerHTML='';
  for(let i=1;i<=c.sessions;i++){const o=document.createElement('option');o.value=i;o.textContent='第'+i+'回';sel.appendChild(o);}
  sel.value=1;
  showScreen('tracker');renderTracker();
}

function changeSession(){currentSession=parseInt(document.getElementById('session-select').value);renderTracker()}

function getFlag(c,si,s){if(!c.flags)c.flags={};const k='s'+si;if(!c.flags[k])c.flags[k]=[];return c.flags[k][s-1]||0}
function setFlag(c,si,s,v){if(!c.flags)c.flags={};const k='s'+si;if(!c.flags[k])c.flags[k]=new Array(c.sessions).fill(0);while(c.flags[k].length<c.sessions)c.flags[k].push(0);c.flags[k][s-1]=v}
function getTotal(c,si){if(!c.flags)return 0;const k='s'+si;if(!c.flags[k])return 0;return c.flags[k].reduce((a,b)=>a+b,0)}

function toggleFlag(si){
  const c=getCourse(currentId);if(!c)return;
  setFlag(c,si,currentSession,getFlag(c,si,currentSession)?0:1);
  save();renderTracker();
}

function renderTracker(){
  const c=getCourse(currentId);if(!c)return;
  let total=0,thisS=0,zero=0;
  c.roster.forEach((_,i)=>{
    const t=getTotal(c,i);total+=t;
    if(getFlag(c,i,currentSession))thisS++;
    if(t===0)zero++;
  });
  document.getElementById('s-total').textContent=total;
  document.getElementById('s-this').textContent=thisS;
  document.getElementById('s-zero').textContent=zero;

  let html='<thead><tr><th class="name-col">氏名</th>';
  for(let s=1;s<=c.sessions;s++)html+=`<th style="${s===currentSession?'color:#185FA5;':''}">${s}</th>`;
  html+='<th>合計</th></tr></thead><tbody>';

  c.roster.forEach((student,i)=>{
    const t=getTotal(c,i);
    const bc=t===0?'':t>=5?'high':'some';
    const name=studentName(student);
    const sid=studentSid(student);
    const kana=studentKana(student);
    const nameCell=`<div style="display:flex;flex-direction:column;gap:1px">
      ${sid?`<span style="font-size:10px;color:var(--text3);letter-spacing:0.02em">${esc(sid)}</span>`:''}
      <span style="font-size:13px">${esc(name)}</span>
      ${kana?`<span style="font-size:10px;color:var(--text2)">${esc(kana)}</span>`:''}
    </div>`;
    html+=`<tr><td class="name-col">${nameCell}</td>`;
    for(let s=1;s<=c.sessions;s++){
      const f=getFlag(c,i,s);const cur=s===currentSession;
      html+=`<td><button class="cell-btn${f?' called':''}${cur&&!f?' cur-session':''}" onclick="toggleFlag(${i})" title="${esc(sid?sid+' ':'')}${esc(name)} 第${s}回"></button></td>`;
    }
    html+=`<td><span class="total-badge ${bc}">${t}</span></td></tr>`;
  });
  html+='</tbody>';
  document.getElementById('roster-table').innerHTML=html;
}

function exportCSV(){
  const c=getCourse(currentId);if(!c)return;
  const hasSid=c.roster.some(s=>studentSid(s));
  const hasKana=c.roster.some(s=>studentKana(s));
  let csv='\uFEFF';
  if(hasSid)csv+='学籍番号,';
  csv+='氏名';
  if(hasKana)csv+=',読み仮名';
  for(let s=1;s<=c.sessions;s++)csv+=`,第${s}回`;
  csv+=',合計\n';
  c.roster.forEach((student,i)=>{
    if(hasSid)csv+=studentSid(student)+',';
    csv+=studentName(student);
    if(hasKana)csv+=','+studentKana(student);
    for(let s=1;s<=c.sessions;s++)csv+=','+getFlag(c,i,s);
    csv+=','+getTotal(c,i)+'\n';
  });
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`${c.univ}_${c.name}_発言記録.csv`;a.click();
  URL.revokeObjectURL(url);
}

function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
function goHome(){showScreen('home');currentId=null;renderHome()}

load();renderHome();
</script>
