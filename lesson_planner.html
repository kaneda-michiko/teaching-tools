<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="授業プランナー">
  <title>授業時間配分チャート</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F7F6F3;
      --surface: #FFFFFF;
      --surface2: #F0EEE9;
      --border: rgba(0,0,0,0.1);
      --border-med: rgba(0,0,0,0.18);
      --text-primary: #1A1A18;
      --text-secondary: #6B6A65;
      --text-hint: #A09F9A;
      --accent: #378ADD;
      --accent-bg: #E6F1FB;
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 2rem 1.5rem 4rem;
    }

    .container { max-width: 560px; margin: 0 auto; }

    .topbar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 1.75rem;
      padding-bottom: 1.25rem;
      border-bottom: 0.5px solid var(--border-med);
    }
    .topbar-left { display: flex; align-items: baseline; gap: 12px; }
    .app-title { font-size: 22px; font-weight: 500; color: var(--text-primary); }
    .app-sub { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-secondary); }
    .date-str { font-size: 12px; color: var(--text-secondary); }

    /* Stats row */
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.75rem; }
    .stat { background: var(--surface); border-radius: var(--radius-md); padding: 0.875rem 1.125rem; border: 0.5px solid var(--border); }
    .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-secondary); margin-bottom: 4px; }
    .stat-val { font-size: 24px; font-weight: 500; color: var(--text-primary); }
    .stat-val.blue { color: var(--accent); }

    /* Chart section */
    .chart-section {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }
    .chart-wrap { position: relative; }
    svg.pie { display: block; }

    /* Legend */
    .legend { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; width: 100%; }
    .legend-item {
      display: flex; align-items: center; gap: 5px;
      background: var(--surface2); border-radius: 100px; padding: 3px 10px;
      border: 0.5px solid var(--border);
    }
    .legend-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .legend-name { font-size: 12px; color: var(--text-secondary); }
    .legend-pct { font-size: 12px; font-weight: 500; color: var(--text-primary); }

    /* Items */
    .section-label {
      font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-secondary); margin-bottom: 8px; font-weight: 500;
    }
    .items-section {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: 1rem;
    }
    .items-header {
      padding: 10px 16px;
      border-bottom: 0.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .items { display: flex; flex-direction: column; }
    .item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 16px;
      border-bottom: 0.5px solid var(--border);
      transition: background 0.1s;
    }
    .item:last-child { border-bottom: none; }
    .item:hover { background: var(--surface2); }
    .item-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .item-name {
      flex: 1; font-size: 13px; color: var(--text-primary);
      border: none; background: transparent; font-family: inherit;
      outline: none; cursor: text;
    }
    .item-name:focus {
      background: var(--surface2); border-radius: 4px;
      padding: 2px 6px; margin: -2px -6px;
    }
    .item-value {
      width: 48px; text-align: right;
      background: var(--surface2);
      border: 0.5px solid var(--border-med);
      border-radius: var(--radius-md);
      color: var(--accent);
      padding: 3px 7px; font-size: 13px;
      font-family: inherit; font-weight: 500; outline: none;
    }
    .item-value:focus { border-color: var(--accent); }
    .item-unit { font-size: 12px; color: var(--text-hint); }
    .item-pct { font-size: 11px; color: var(--text-secondary); width: 32px; text-align: right; font-weight: 500; }
    .item-del {
      background: none; border: none; color: var(--text-hint);
      cursor: pointer; font-size: 16px; padding: 0 2px; line-height: 1;
      opacity: 0; transition: opacity 0.1s; font-family: inherit;
    }
    .item:hover .item-del { opacity: 0.5; }
    .item-del:hover { opacity: 1 !important; color: #A32D2D; }

    .total-row {
      display: flex; justify-content: flex-end; align-items: center;
      gap: 8px; padding: 10px 16px;
      border-top: 0.5px solid var(--border-med);
      background: var(--surface2);
    }
    .total-label { font-size: 12px; color: var(--text-secondary); }
    .total-value { font-size: 18px; font-weight: 500; color: var(--text-primary); }
    .total-unit { font-size: 12px; color: var(--text-secondary); }

    /* Add form */
    .add-section {
      background: var(--surface2);
      border-radius: var(--radius-lg);
      padding: 1rem 1.125rem;
      border: 0.5px solid var(--border);
      margin-bottom: 1.25rem;
    }
    .add-row { display: flex; gap: 8px; margin-top: 8px; }
    .add-name {
      flex: 1; background: var(--surface); border: 0.5px solid var(--border-med);
      border-radius: var(--radius-md); color: var(--text-primary); padding: 8px 12px;
      font-size: 13px; font-family: inherit; outline: none;
    }
    .add-name::placeholder { color: var(--text-hint); }
    .add-name:focus { border-color: var(--accent); }
    .add-min {
      width: 60px; background: var(--surface); border: 0.5px solid var(--border-med);
      border-radius: var(--radius-md); color: var(--accent); padding: 8px 10px;
      font-size: 13px; font-family: inherit; font-weight: 500;
      outline: none; text-align: center;
    }
    .add-min:focus { border-color: var(--accent); }
    .add-btn {
      background: var(--text-primary); border: none; border-radius: var(--radius-md);
      color: var(--surface); padding: 8px 16px; cursor: pointer;
      font-size: 16px; line-height: 1; font-weight: 500; font-family: inherit;
      transition: opacity 0.12s;
    }
    .add-btn:hover { opacity: 0.82; }
    .add-btn:active { opacity: 0.65; }

    /* Footer */
    .footer-row {
      display: flex; justify-content: flex-end; align-items: center;
      padding-top: 1.25rem;
      border-top: 0.5px solid var(--border-med);
    }
    .btn-clear {
      font-size: 12px; font-family: inherit;
      color: var(--text-secondary);
      background: none;
      border: 0.5px solid var(--border-med);
      border-radius: var(--radius-md);
      padding: 5px 14px;
      cursor: pointer;
      transition: color 0.12s, border-color 0.12s;
    }
    .btn-clear:hover { color: #A32D2D; border-color: #F7C1C1; }

    /* Empty state */
    .empty-chart {
      width: 220px; height: 220px; border-radius: 50%;
      background: var(--surface2); border: 0.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-hint); font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="topbar-left">
        <span class="app-title">授業プランナー</span>
        <span class="app-sub">lesson planner</span>
      </div>
      <span class="date-str" id="dateStr"></span>
    </div>

    <div class="stats-row">
      <div class="stat">
        <div class="stat-label">合計</div>
        <div class="stat-val" id="statTotal">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">項目数</div>
        <div class="stat-val blue" id="statCount">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">平均</div>
        <div class="stat-val" id="statAvg">—</div>
      </div>
    </div>

    <div class="chart-section">
      <div class="chart-wrap" id="chartWrap"></div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="items-section">
      <div class="items-header">
        <span class="section-label" style="margin-bottom:0">授業項目</span>
      </div>
      <div class="items" id="itemList"></div>
      <div class="total-row">
        <span class="total-label">合計</span>
        <span class="total-value" id="totalValue">0</span>
        <span class="total-unit">分</span>
      </div>
    </div>

    <div class="add-section">
      <div class="section-label">項目を追加</div>
      <div class="add-row">
        <input class="add-name" id="addName" type="text" placeholder="項目名（例：グループワーク）">
        <input class="add-min" id="addMin" type="number" min="1" placeholder="分">
        <button class="add-btn" id="addBtn">＋</button>
      </div>
    </div>

    <div class="footer-row">
      <button class="btn-clear" id="btnClear">すべてリセット</button>
    </div>
  </div>

  <script>
    const PALETTE = [
      "#85B7EB","#5DCAA5","#FAC775","#F09595",
      "#AFA9EC","#9FE1CB","#EF9F27","#F4C0D1",
      "#6BB8B8","#C0DD97"
    ];
    const PALETTE_TEXT = [
      "#0C447C","#085041","#633806","#791F1F",
      "#3C3489","#0F6E56","#412402","#72243E",
      "#1A5555","#27500A"
    ];

    let items = [
      { id: 1, name: "導入・復習", value: 10 },
      { id: 2, name: "新規内容の説明", value: 20 },
      { id: 3, name: "練習・活動", value: 15 },
    ];
    let nextId = 4;

    function getTotal() {
      return items.reduce((s, i) => s + i.value, 0);
    }

    function renderStats() {
      const total = getTotal();
      const count = items.filter(i => i.value > 0).length;
      document.getElementById('statTotal').textContent = total;
      document.getElementById('statCount').textContent = count;
      document.getElementById('statAvg').textContent = count > 0 ? Math.round(total / count) : '—';
    }

    function renderChart() {
      const wrap = document.getElementById('chartWrap');
      const size = 220;
      const cx = size / 2, cy = size / 2, r = size / 2 - 4;
      const segs = items.filter(i => i.value > 0);
      const total = segs.reduce((s, i) => s + i.value, 0);

      if (!segs.length || total === 0) {
        wrap.innerHTML = '<div class="empty-chart">項目を追加してください</div>';
        return;
      }

      let paths = '';
      let cumAngle = -Math.PI / 2;

      segs.forEach((seg, i) => {
        const angle = (seg.value / total) * 2 * Math.PI;
        const x1 = cx + r * Math.cos(cumAngle);
        const y1 = cy + r * Math.sin(cumAngle);
        const x2 = cx + r * Math.cos(cumAngle + angle);
        const y2 = cy + r * Math.sin(cumAngle + angle);
        const large = angle > Math.PI ? 1 : 0;
        const midAngle = cumAngle + angle / 2;
        const lx = cx + r * 0.65 * Math.cos(midAngle);
        const ly = cy + r * 0.65 * Math.sin(midAngle);
        const pct = Math.round((seg.value / total) * 100);
        const color = PALETTE[i % PALETTE.length];

        if (segs.length === 1) {
          paths += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}"/>`;
        } else {
          paths += `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large},1 ${x2},${y2} Z" fill="${color}" stroke="#FFFFFF" stroke-width="2"/>`;
        }
        if (pct >= 5) {
          const fs = pct > 15 ? 12 : 10;
          const textColor = PALETTE_TEXT[i % PALETTE_TEXT.length];
          paths += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="${textColor}" font-size="${fs}" font-weight="500" font-family="'Noto Sans JP',sans-serif">${pct}%</text>`;
        }
        cumAngle += angle;
      });

      wrap.innerHTML = `
        <svg class="pie" width="${size}" height="${size}">
          ${paths}
          <circle cx="${cx}" cy="${cy}" r="${r * 0.38}" fill="#FFFFFF"/>
          <text x="${cx}" y="${cy - 8}" text-anchor="middle" fill="#1A1A18" font-size="20" font-weight="500" font-family="'Noto Sans JP',sans-serif">${total}</text>
          <text x="${cx}" y="${cy + 11}" text-anchor="middle" fill="#6B6A65" font-size="9" font-family="'Noto Sans JP',sans-serif">分合計</text>
        </svg>`;
    }

    function renderItems() {
      const list = document.getElementById('itemList');
      const total = getTotal();
      list.innerHTML = '';

      items.forEach((item, idx) => {
        const color = PALETTE[idx % PALETTE.length];
        const pct = total > 0 ? Math.round((item.value / total) * 100) : 0;
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `
          <div class="item-dot" style="background:${color}"></div>
          <input class="item-name" type="text" value="${item.name}" data-id="${item.id}">
          <input class="item-value" type="number" min="0" value="${item.value}" data-id="${item.id}">
          <span class="item-unit">分</span>
          <span class="item-pct">${pct}%</span>
          <button class="item-del" data-id="${item.id}">×</button>
        `;
        list.appendChild(div);
      });

      document.getElementById('totalValue').textContent = total;
    }

    function renderLegend() {
      const legend = document.getElementById('legend');
      const total = getTotal();
      const segs = items.filter(i => i.value > 0);
      legend.innerHTML = segs.map((item, idx) => {
        const pct = total > 0 ? Math.round((item.value / total) * 100) : 0;
        const color = PALETTE[idx % PALETTE.length];
        return `
          <div class="legend-item">
            <div class="legend-dot" style="background:${color}"></div>
            <span class="legend-name">${item.name}</span>
            <span class="legend-pct">${pct}%</span>
          </div>`;
      }).join('');
    }

    function render() {
      renderStats();
      renderChart();
      renderItems();
      renderLegend();
    }

    document.getElementById('itemList').addEventListener('input', e => {
      const id = parseInt(e.target.dataset.id);
      if (!id) return;
      const item = items.find(i => i.id === id);
      if (!item) return;
      if (e.target.classList.contains('item-value')) {
        const v = parseInt(e.target.value);
        if (!isNaN(v) && v >= 0) { item.value = v; renderStats(); renderChart(); renderLegend(); renderItems(); }
      } else if (e.target.classList.contains('item-name')) {
        item.name = e.target.value;
        renderLegend();
      }
    });

    document.getElementById('itemList').addEventListener('click', e => {
      if (e.target.classList.contains('item-del')) {
        const id = parseInt(e.target.dataset.id);
        items = items.filter(i => i.id !== id);
        render();
      }
    });

    function addItem() {
      const nameEl = document.getElementById('addName');
      const minEl = document.getElementById('addMin');
      const name = nameEl.value.trim();
      const value = parseInt(minEl.value);
      if (!name || isNaN(value) || value <= 0) return;
      items.push({ id: nextId++, name, value });
      nameEl.value = '';
      minEl.value = '';
      render();
    }

    document.getElementById('addBtn').addEventListener('click', addItem);
    document.getElementById('addName').addEventListener('keydown', e => e.key === 'Enter' && addItem());
    document.getElementById('addMin').addEventListener('keydown', e => e.key === 'Enter' && addItem());

    document.getElementById('btnClear').addEventListener('click', () => {
      if (!items.length || !confirm('すべての項目を削除しますか？')) return;
      items = [];
      nextId = 1;
      render();
    });

    const d = new Date();
    document.getElementById('dateStr').textContent = d.toLocaleDateString('ja-JP', { year: 'numeric', month: 'short', day: 'numeric', weekday: 'short' });

    render();
  </script>
</body>
</html>
