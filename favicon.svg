<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- rounded square background -->
  <rect width="32" height="32" rx="7" fill="#252523"/>

  <!-- open book - left page -->
  <path d="M5 10 C5 10 10.5 11.5 15.5 11.5 L15.5 24 C10.5 24 5 22.5 5 22.5 Z"
        fill="#F0EFE9" opacity="0.92"/>

  <!-- open book - right page -->
  <path d="M27 10 C27 10 21.5 11.5 16.5 11.5 L16.5 24 C21.5 24 27 22.5 27 22.5 Z"
        fill="#F0EFE9" opacity="0.72"/>

  <!-- spine -->
  <line x1="16" y1="11.5" x2="16" y2="24" stroke="#252523" stroke-width="1.5"/>

  <!-- text lines on left page -->
  <line x1="7.5"  y1="15" x2="13.5" y2="15.2" stroke="#A09F9A" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="7.5"  y1="17.5" x2="13.5" y2="17.7" stroke="#A09F9A" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="7.5"  y1="20"  x2="11"   y2="20.1" stroke="#A09F9A" stroke-width="0.9" stroke-linecap="round"/>

  <!-- school color dots bottom row -->
  <circle cx="10"  cy="28" r="1.7" fill="#A6213F"/>
  <circle cx="14"  cy="28" r="1.7" fill="#3E49AB"/>
  <circle cx="18"  cy="28" r="1.7" fill="#4D9554"/>
  <circle cx="22"  cy="28" r="1.7" fill="#6CC2C5"/>
</svg>
